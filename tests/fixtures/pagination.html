<!doctype html><html lang="id"><meta charset="utf-8"><title>Uji pagination DMS</title><link rel="stylesheet" href="../../src/styles.css?v=0.17"><style>body{padding:25px;background:#f6f8fc}main{max-width:1200px;margin:auto}.panel{margin:20px 0}h1{font-size:24px}h2{padding:16px}input{padding:8px}</style><main id="test-root"><h1>Uji pagination</h1><button id="filter-rows" type="button">Filter 3 data</button><button id="reset-rows" type="button">Semua data</button><section class="panel"><h2>Transaksi</h2><div class="table-scroll"><table><thead><tr><th rowspan="2">Kode</th><th colspan="2">Produk</th></tr><tr><th>Jumlah</th><th>Retur</th></tr></thead><tbody id="test-rows"></tbody></table></div></section><section class="panel"><h2>Nomor yang sudah ada</h2><table><thead><tr><th>Baris</th><th>Nama</th></tr></thead><tbody id="numbered-rows"></tbody></table></section><section class="panel"><h2>Riwayat kartu</h2><div id="card-rows"></div></section><section class="panel"><h2>Input 60 tanggal</h2><form><table><thead><tr><th>Tanggal</th><th>Jumlah</th></tr></thead><tbody id="form-rows"></tbody></table><button type="submit">Validasi</button></form></section></main><script type="module">
import {installListPagination} from '../../src/components/pagination.js?v=0.17';
const root=document.querySelector('#test-root'),rows=document.querySelector('#test-rows');
function fill(count){rows.innerHTML=Array.from({length:count},(_,i)=>`<tr><td>DST-${i+1}</td><td>${i+1}</td><td>0</td></tr>`).join('')||'<tr><td colspan="3" class="empty-state">Kosong</td></tr>';}
fill(121);document.querySelector('#numbered-rows').innerHTML=Array.from({length:51},(_,i)=>`<tr><td>${i+1}</td><td>Nama ${i+1}</td></tr>`).join('');document.querySelector('#card-rows').innerHTML=Array.from({length:55},(_,i)=>`<div class="detail-record"><span>PAY-${i+1}</span><strong>Rp1.000</strong></div>`).join('');document.querySelector('#form-rows').innerHTML=Array.from({length:60},(_,i)=>`<tr><td>Tanggal ${i+1}</td><td><input aria-label="Jumlah ${i+1}" type="number" value="0" min="0" required></td></tr>`).join('');document.querySelector('#filter-rows').onclick=()=>fill(3);document.querySelector('#reset-rows').onclick=()=>fill(121);document.querySelector('form').onsubmit=e=>e.preventDefault();installListPagination(root);
</script></html>
